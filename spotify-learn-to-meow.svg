<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Learn To Meow playback at 1 minute 30 seconds">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset="0.55" stop-color="#15102a"/>
    <stop offset="1" stop-color="#071b17"/>
  </linearGradient>
  <linearGradient id="progress" x1="0" x2="1">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="0.55" stop-color="#EC4899"/>
    <stop offset="1" stop-color="#1DB954"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="1" y="1" width="898" height="218" rx="28" fill="url(#bg)" stroke="#24283b"/>

<!-- Spotify mark -->
<circle cx="88" cy="110" r="52" fill="#1DB954" opacity=".14" filter="url(#glow)"/>
<circle cx="88" cy="110" r="43" fill="#1DB954"/>
<path d="M65 99c15-7 34-6 47 1M69 111c12-5 27-4 38 1M73 122c9-3 19-2 27 1" fill="none" stroke="#071b17" stroke-width="6" stroke-linecap="round"/>

<text x="158" y="68" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">CURRENTLY LISTENING</text>
<text x="158" y="106" fill="#F9FAFB" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Learn To Meow</text>
<text x="158" y="134" fill="#B8B9C8" font-family="Arial, Helvetica, sans-serif" font-size="16">WENGIE · Xiaofengfeng · Xiaopanpan</text>

<!-- 1:30 playback visualization -->
<g transform="translate(158 166)">
  <text x="0" y="0" fill="#F9FAFB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">1:30</text>
  <text x="610" y="0" fill="#7F8496" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">3:36</text>
  <rect x="0" y="13" width="652" height="4" rx="2" fill="#303445"/>
  <!-- 1:30 / 3:36 = 41.7% -->
  <rect x="0" y="13" width="271" height="4" rx="2" fill="url(#progress)"/>
  <circle cx="271" cy="15" r="7" fill="#F9FAFB" filter="url(#glow)">
    <animate attributeName="r" values="6;8;6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="271" cy="15" r="3.5" fill="#1DB954"/>
</g>

<text x="158" y="207" fill="#1DB954" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">01:30 PLAYED · 02:06 REMAINING</text>

<!-- subtle moving shimmer across the progress line -->
<rect x="158" y="178" width="80" height="3" rx="1.5" fill="#FFFFFF" opacity=".22">
  <animate attributeName="x" values="158;429;158" dur="4s" repeatCount="indefinite"/>
</rect>
</svg>