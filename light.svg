<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .portrait-dot { fill: #7C3AED; animation: fadeIn 2s ease-out forwards; }
      .live-badge { animation: pulse 2s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Terminal Frame -->
  <rect x="20" y="30" width="1140" height="550" fill="none" stroke="#0891B2" stroke-width="2" rx="8"/>
  
  <!-- Title Bar -->
  <rect x="20" y="30" width="1140" height="35" fill="#0891B2" rx="8" ry="8"/>
  <text x="35" y="52" font-size="12" font-family="Courier New, monospace" font-weight="bold" fill="#E0E7FF">
    ▌ profile.sh --live
  </text>

  <!-- Portrait Section Label -->
  <text x="50" y="80" font-size="10" font-family="Courier New, monospace" fill="#10B981" opacity="0.6">
    VISUAL.MAP
  </text>

  <!-- Sample Dithered Portrait (Placeholder dots) -->
  <g id="portrait-layer">
    <!-- Head area - denser dots -->
    <circle cx="100" cy="120" r="2" class="portrait-dot" style="animation-delay: 0s"/>
    <circle cx="110" cy="115" r="2" class="portrait-dot" style="animation-delay: 0.03s"/>
    <circle cx="120" cy="125" r="2" class="portrait-dot" style="animation-delay: 0.06s"/>
    <circle cx="130" cy="130" r="2" class="portrait-dot" style="animation-delay: 0.09s"/>
    <circle cx="140" cy="120" r="2" class="portrait-dot" style="animation-delay: 0.12s"/>
    <circle cx="105" cy="140" r="2" class="portrait-dot" style="animation-delay: 0.15s"/>
    <circle cx="115" cy="145" r="2" class="portrait-dot" style="animation-delay: 0.18s"/>
    <circle cx="125" cy="150" r="2" class="portrait-dot" style="animation-delay: 0.21s"/>
    <circle cx="135" cy="145" r="2" class="portrait-dot" style="animation-delay: 0.24s"/>
    <circle cx="145" cy="140" r="2" class="portrait-dot" style="animation-delay: 0.27s"/>
    <circle cx="110" cy="160" r="2" class="portrait-dot" style="animation-delay: 0.30s"/>
    <circle cx="120" cy="165" r="2" class="portrait-dot" style="animation-delay: 0.33s"/>
    <circle cx="130" cy="170" r="2" class="portrait-dot" style="animation-delay: 0.36s"/>
    <circle cx="140" cy="165" r="2" class="portrait-dot" style="animation-delay: 0.39s"/>
    <circle cx="95" cy="100" r="2" class="portrait-dot" style="animation-delay: 0.42s"/>
    <circle cx="150" cy="110" r="2" class="portrait-dot" style="animation-delay: 0.45s"/>
    <circle cx="100" cy="180" r="2" class="portrait-dot" style="animation-delay: 0.48s"/>
    <circle cx="145" cy="180" r="2" class="portrait-dot" style="animation-delay: 0.51s"/>
  </g>

  <!-- System Info Section -->
  <text x="370" y="70" font-size="10" font-family="Courier New, monospace" fill="#10B981" opacity="0.6">
    SYSTEM.INFO
  </text>

  <!-- Info Panel Rows -->
  <text x="370" y="100" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
    Subject
  </text>
  <text x="650" y="100" font-size="11" font-family="Courier New, monospace" fill="#0A101F" text-anchor="end">
    AREEBA CHANDNI CHEEMA
  </text>

  <text x="370" y="125" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
    Role
  </text>
  <text x="650" y="125" font-size="11" font-family="Courier New, monospace" fill="#0A101F" text-anchor="end">
    AI-Focused Developer
  </text>

  <text x="370" y="150" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
    Origin
  </text>
  <text x="650" y="150" font-size="11" font-family="Courier New, monospace" fill="#0A101F" text-anchor="end">
    Lahore, Pakistan
  </text>

  <text x="370" y="175" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
    Education
  </text>
  <text x="650" y="175" font-size="11" font-family="Courier New, monospace" fill="#0A101F" text-anchor="end">
    BS CS, UET LAHORE
  </text>

  <text x="370" y="200" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
    Status
  </text>
  <text x="650" y="200" font-size="11" font-family="Courier New, monospace" fill="#0A101F" text-anchor="end">
    Studying + Building
  </text>

  <text x="370" y="225" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
    ToolChain
  </text>
  <text x="650" y="225" font-size="11" font-family="Courier New, monospace" fill="#0A101F" text-anchor="end">
    VS Code, Git, Python
  </text>

  <text x="370" y="260" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
    Core.Lang
  </text>
  <text x="650" y="260" font-size="11" font-family="Courier New, monospace" fill="#0A101F" text-anchor="end">
    Python, C++, JS
  </text>

  <text x="370" y="285" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
    Core.Frontend
  </text>
  <text x="650" y="285" font-size="11" font-family="Courier New, monospace" fill="#0A101F" text-anchor="end">
    React, HTML/CSS, Tailwind
  </text>

  <text x="370" y="310" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
    Core.Backend
  </text>
  <text x="650" y="310" font-size="11" font-family="Courier New, monospace" fill="#0A101F" text-anchor="end">
    Node.js, Django, PHP
  </text>

  <text x="370" y="335" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
    Core.Database
  </text>
  <text x="650" y="335" font-size="11" font-family="Courier New, monospace" fill="#0A101F" text-anchor="end">
    MySQL, Firebase
  </text>

  <text x="370" y="360" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#10B981">
