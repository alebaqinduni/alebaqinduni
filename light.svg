  </text>

  <!-- Live Badge -->
  <rect x="575" y="395" width="60" height="22" fill="#EF4444" rx="4" class="live-badge"/>
  <text x="605" y="411" font-size="11" font-family="Courier New, monospace" font-weight="bold" fill="#FFFFFF" text-anchor="middle" class="live-badge">
    ● LIVE
  </text>
</svg>