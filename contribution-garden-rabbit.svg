<svg xmlns="http://www.w3.org/2000/svg" width="985" height="255" viewBox="0 0 985 255">
<defs>
  <filter id="bunnyGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="cells" width="17" height="17" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="13" height="13" rx="3" fill="#171923" stroke="#252A3A" stroke-width=".7"/></pattern>
  <style>
    .bunny-motion{animation:bunny-travel 12s linear infinite}
    .paw-left{transform-origin:-15px 11px;animation:paw-left .55s ease-in-out infinite}
    .paw-mid{transform-origin:-1px 15px;animation:paw-mid .55s ease-in-out infinite}
    .paw-right{transform-origin:12px 13px;animation:paw-right .55s ease-in-out infinite}
    @keyframes bunny-travel{
      0%{transform:translate(85px,148px) rotate(-8deg)}
      14%{transform:translate(239px,132px) rotate(-6deg)}
      29%{transform:translate(407px,151px) rotate(7deg)}
      43%{transform:translate(578px,115px) rotate(-9deg)}
      57%{transform:translate(758px,150px) rotate(8deg)}
      71%{transform:translate(884px,182px) rotate(16deg)}
      86%{transform:translate(620px,126px) rotate(-4deg)}
      100%{transform:translate(85px,148px) rotate(-8deg)}
    }
    @keyframes paw-left{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}}
    @keyframes paw-mid{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
    @keyframes paw-right{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}}
  </style>
</defs>
<rect width="985" height="255" rx="18" fill="#090B12"/>
<rect x="8" y="8" width="969" height="239" rx="14" fill="#0F1320" stroke="#252A3A"/>
