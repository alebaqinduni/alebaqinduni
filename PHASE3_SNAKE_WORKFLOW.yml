name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate snake SVG (Dark Mode)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alebaqinduni
          # IMPORTANT: default GITHUB_TOKEN usually can't read the GraphQL
          # contribution calendar. Use a personal access token instead
          # (create one with 'read:user' scope, save it as a repo secret
          # named GH_PAT, then reference it here).
          github_token: ${{ secrets.GH_PAT }}
          outputs: |
            dist/snake-dark.svg?palette=dark&color_dots=161B22,10B981,0891B2,A78BFA,E0E7FF

      - name: Generate snake SVG (Light Mode)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alebaqinduni
          github_token: ${{ secrets.GH_PAT }}
          outputs: |
            dist/snake-light.svg?palette=light&color_dots=EBEDF0,10B981,0891B2,A78BFA,4C1D95

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
