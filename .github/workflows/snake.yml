name: Generate Profile Graphics 🐍📊

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate live profile graphs 📊
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: alebaqinduni
          OUTPUT_DIR: dist
        run: python3 scripts/generate_profile_graphics.py

      - name: Generate contribution snake 🐍
        uses: Platane/snk@v3
        with:
          github_user_name: alebaqinduni
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=4C1D95&color_dots=EBEDF0,9BE9A8,40C463,30A14E,216E39
            dist/snake-dark.svg?palette=github-dark&color_snake=A78BFA&color_dots=161B22,0E4429,006D32,26A641,39D353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish profile graphics 🚀
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
