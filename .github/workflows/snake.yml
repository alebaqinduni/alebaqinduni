name: Generate Profile Graphics 🐇📊

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate live profile graphs 📊
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: alebaqinduni
          OUTPUT_DIR: dist
        run: python3 scripts/generate_profile_graphics.py

      - name: Add pink bunny contribution garden 🐇
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: alebaqinduni
          OUTPUT_DIR: dist
        run: python3 scripts/generate_bunny_contribution_graph.py

      - name: Publish profile graphics 🚀
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
