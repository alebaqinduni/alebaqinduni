name: Generate Contribution Snake 🐍

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation 🐍
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=A78BFA&color_dots=EBEDF0,D8B4FE,A78BFA,8B5CF6,4C1D95
            dist/snake-dark.svg?palette=github-dark&color_snake=A78BFA&color_dots=161B22,6EE7B7,10B981,0891B2,A78BFA
            dist/snake.gif?color_snake=A78BFA&color_dots=161B22,6EE7B7,10B981,0891B2,A78BFA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated animations 🚀
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
