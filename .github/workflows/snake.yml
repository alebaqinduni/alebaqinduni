name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alebaqinduni
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-dark.svg?palette=dark&color_dots=161B22,10B981,0891B2,A78BFA,E0E7FF
            dist/snake-light.svg?palette=light&color_dots=EBEDF0,10B981,0891B2,A78BFA,4C1D95

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
